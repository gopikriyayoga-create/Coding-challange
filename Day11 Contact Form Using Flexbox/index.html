<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design the contact form layout with Flexbox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
       <section> 
        <div class="con-info">
            <h2>Just say Hello !</h2>
            <p>Let us know more about you !</p>
            <div class="info">
            <input type="text" placeholder="First Name">
            <input type="text" placeholder="Last Name">
            <input type="text" placeholder="Mail">
            <input type="text" placeholder="Phone">
            <input type="text" id="msg-box" placeholder="Message">
            </div><br>
            <button>SUBMIT</button>
        </div>
        <div class="con-info2">
            <h2>Contact Information</h2>
            <p>77,Nethaji Road, Old Corporation Road, Madurai-638106</p>
            <p>Call us - +91-8300125478</p>
            <p>We are open Monday to Friday 8.00 am-5.00 pm</p>
            <h3>Follow Us</h3>
            <p>Facebook  Instagram  Vimeo</p>
        </div>
        </section>
    </main>
    
</body>
</html>
