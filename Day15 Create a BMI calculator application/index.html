<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>BMI Calculator</h1>
        
        <div class="input-group">
            <label for="height">Height (cm):</label>
            <input type="number" id="height" placeholder="e.g., 175">
        </div>

        <div class="input-group">
            <label for="weight">Weight (kg):</label>
            <input type="number" id="weight" placeholder="e.g., 70">
        </div>
        
        <button id="calculateBtn">Calculate BMI</button>
        
        <div class="result-container">
            <h2>Your BMI: <span id="bmiResult">0.0</span></h2>
            <p id="status"></p>
        </div>
        
        <div class="classification-chart">
            <h3>BMI Classification Chart</h3>
            

[Image of BMI classification chart]

            <ul>
                <li>Below 18.5: Underweight</li>
                <li>18.5 – 24.9: Healthy Weight</li>
                <li>25.0 – 29.9: Overweight</li>
                <li>30.0 and Above: Obesity</li>
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
