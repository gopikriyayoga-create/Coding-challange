<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact form layout using css Grid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Contact Us</h1>
    </header>

    <main>
        <div class="container">

            <div class="box">
                <h1>Location</h1>
                <p>San Francisco,California,United states.</p>
            </div>

            <div class="box">
                <h1>Contact</h1>
                <p>+8784846545</p>
                <p>+8948787877</p>
            </div>

            <div class="box">
                <h1>E-mail</h1>
                <p>sanfrancisco.cal@yahoo.com</p>

            </div>

            <div class="box">
                <h1>Visit Between</h1>
                <p>Noon: 3.30PM to 5.30PM</p>

            </div>
        </div>
    </main>

    <aside>
        <div class="box2">
            <h1>Send Us A Message</h1>
            <form action="contact">
                <input type="text" placeholder="Full Name">
                <input type="email" placeholder="E-mail">
                <input type="phone" placeholder="Phone">
                <input type="text" placeholder="Message" id="Message">
                <button>Submit</button>
            </form>
            
        </div>

        <div class="box3">
               <img src="Location.png" alt="map" width="500">
        </div>
    </aside>
</body>
</html>
